name: Research quality

on:
  pull_request:
  push:
    branches:
      - research/wristwatch-btc-poc

permissions:
  contents: read

jobs:
  python-quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OMP_NUM_THREADS: '1'
      MPLBACKEND: Agg
      QUANTITO_OFFLINE_TESTS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e ".[dev,research]"
      - run: python -m pytest -q
      - run: ruff check .
      - run: ruff format --check .
      - run: git diff --check
