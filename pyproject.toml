[project]
name = "quantito"
version = "0.1.0"
description = "Quantitative Strategy Execution Engine and Signal Service"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
    "httpx>=0.27.0",
    "pytest>=8.0",
]

research = [
    "certifi>=2025.1",
    "numpy==2.4.0",
    "pandas==2.3.3",
    "pyarrow==22.0.0",
    "scikit-learn==1.7.2",
    "matplotlib==3.10.7",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["quantito"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["SIM102", "RUF059", "E402", "F841"]
