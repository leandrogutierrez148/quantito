[project]
name = "quantito"
version = "0.1.0"
description = "Algorithmic Trading & Financial Market Ingestion Engine"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "google-cloud-bigquery>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".venv",
    ".git",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # Ruff-specific rules
]
ignore = [
    "E501",   # Line length handled by formatter
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["engine", "pipelines"]

[tool.ruff.lint.per-file-ignores]
"notebooks/*" = ["SIM102", "RUF059", "E402", "F841"]
